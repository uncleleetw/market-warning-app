name: Daily Market Risk Signal Check

on:
  schedule:
    # 這是國際標準時間 (UTC) 00:30，換算台灣時間就是每天早上 08:30 自動執行
    - cron: '30 0 * * *'
  workflow_dispatch: # 允許手動點擊測試

jobs:
  check-market:
    runs-on: ubuntu-latest

    steps:
    - name: 複製儲存庫代碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install requests yfinance

    - name: 執行總經警戒檢查並發送 LINE 通知
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: "${{ secrets.LINE_USER_ID }}"
      run: python market_warning.py
